databaseChangeLog:
  - changeSet:
      id: 002-create-courier-profile-table
      author: user
      changes:
        - createTable:
            tableName: courier_profile
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: courier_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: vehicle_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: license_plate
                  type: VARCHAR(20)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: courier_profile
            baseColumnNames: courier_id
            referencedTableName: couriers
            referencedColumnNames: id
            constraintName: fk_courier_profile_courier
            onDelete: CASCADE
        - createIndex:
            tableName: courier_profile
            indexName: idx_courier_profile_courier_id
            columns:
              - column:
                  name: courier_id