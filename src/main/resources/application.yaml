server:
  port: 9092
spring:
  datasource:
    url:
      jdbc:postgresql://localhost:5432/courier_db
    username: postgres
    password: 1234
  jpa:
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs